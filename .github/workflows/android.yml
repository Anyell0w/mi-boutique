name: Compilar APK Android
on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5

      # Localiza la carpeta del proyecto (funciona si está en la raíz o dentro de una subcarpeta)
      - name: Ubicar proyecto
        id: dir
        run: |
          PKG=$(find . -name package.json -not -path "*/node_modules/*" -exec grep -l '"mi-boutique"' {} + | head -1)
          if [ -z "$PKG" ]; then echo "::error::No se encontró package.json de mi-boutique en el repositorio"; ls -la; exit 1; fi
          DIR=$(dirname "$PKG")
          echo "Proyecto en: $DIR"
          echo "path=$DIR" >> "$GITHUB_OUTPUT"
          ls -la "$DIR"

      - uses: actions/setup-node@v5
        with:
          node-version: 22

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 21

      # El runner de GitHub ya trae el Android SDK; solo se aseguran los paquetes necesarios
      - name: Preparar Android SDK
        run: |
          SDK="${ANDROID_HOME:-/usr/local/lib/android/sdk}"
          echo "ANDROID_HOME=$SDK" >> "$GITHUB_ENV"
          echo "ANDROID_SDK_ROOT=$SDK" >> "$GITHUB_ENV"
          SDKM=$(ls "$SDK"/cmdline-tools/*/bin/sdkmanager | sort -V | tail -1)
          yes | "$SDKM" --licenses > /dev/null || true
          "$SDKM" --install "platform-tools" "platforms;android-36" "build-tools;36.0.0"

      - name: Instalar dependencias
        working-directory: ${{ steps.dir.outputs.path }}
        run: |
          if [ -f package-lock.json ]; then npm ci; else npm install; fi

      - name: Compilar web y sincronizar Android
        working-directory: ${{ steps.dir.outputs.path }}
        run: |
          npm run build
          if [ ! -d android ]; then npx cap add android; fi
          npx cap sync android

      - name: Compilar APK (debug)
        working-directory: ${{ steps.dir.outputs.path }}/android
        run: |
          chmod +x gradlew
          ./gradlew assembleDebug --no-daemon --stacktrace

      - uses: actions/upload-artifact@v4
        with:
          name: mi-boutique-apk
          path: ${{ steps.dir.outputs.path }}/android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
